name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build .\LumaSync.slnx -c Release
      - name: Run regression harness
        run: dotnet run --project .\tests\LumaSync.Tests\LumaSync.Tests.csproj -c Release --no-build
      - name: Publish x64
        run: dotnet publish .\src\LumaSync.App\LumaSync.App.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o .\publish
      - uses: actions/upload-artifact@v4
        with:
          name: LumaSync-win-x64
          path: .\publish\
